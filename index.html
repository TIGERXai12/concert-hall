<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>沉浸式音乐厅 · Immersive Concert Hall</title>
  <link rel="stylesheet" href="styles.css?v=18" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="entry">
    <div class="entry-card">
      <h1>音乐厅</h1>
      <button id="enterBtn" type="button">进入</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="online"></div>
    <div id="hint">点地面走路 · 点座位入座 · 拖动环顾 · 双指缩放</div>
    <div id="seatLabel" class="hidden"></div>
    <div id="controls">
      <button id="standBtn" class="hidden" type="button">起身换座</button>
    </div>
  </div>

  <div id="seatPrompt" class="hidden">
    <span id="seatPromptText"></span>
    <button id="sitBtn" type="button">坐下</button>
  </div>

  <div id="joystick" class="hidden">
    <div id="joyBase"><div id="joyKnob"></div></div>
  </div>

  <canvas id="c"></canvas>

  <script type="module" src="js/main.js?v=18"></script>
</body>
</html>
